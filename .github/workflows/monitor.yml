name: Vigilar stock

on:
  schedule:
    # La comprobación cada 5 minutos la lanza cron-job.org; esto es solo un respaldo por si falla.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      resumen:
        description: "Mandar al móvil un resumen de todo lo que hay en stock ahora mismo"
        type: boolean
        default: true

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write   # para actualizar datos/stock.json (lo usa la web)

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (para preparar las fotos)
        run: pip install --quiet --disable-pip-version-check pillow

      - name: Recuperar estado anterior
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Comprobar stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py ${{ inputs.resumen && '--resumen' || '' }}

      - name: Guardar estado
        if: ${{ !inputs.resumen }}
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}

      - name: Avisar si GitHub falla antes de comprobar
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Content-Type: application/json" https://ntfy.sh -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"⚠️ El monitor de stock está fallando\",\"message\":\"Ha fallado la ejecución en GitHub. Toca para ver el error.\",\"click\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"priority\":4,\"tags\":[\"warning\"]}"

      - name: Publicar datos para la web
        run: |
          if [ -n "$(git status --porcelain datos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos
            git commit -q -m "Actualizar stock"
            git pull -q --rebase
            git push -q
          fi
