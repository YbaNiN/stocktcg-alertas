name: Vigilar stock

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub a veces lo retrasa un poco)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba: lista lo que hay en stock con tus filtros y manda una notificación de prueba"
        type: boolean
        default: false

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar estado anterior
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Comprobar stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py ${{ inputs.prueba && '--prueba' || '' }}

      - name: Guardar estado
        if: ${{ !inputs.prueba }}
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
