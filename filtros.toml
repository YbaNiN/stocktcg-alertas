# ============================================================
#  FILTROS DE ALERTAS  —  edita este archivo para elegir qué te avisa
# ============================================================
#
# Cada bloque [[alerta]] es un filtro. Te llega una notificación cuando un
# producto VUELVE a estar en stock (o aparece nuevo) y cumple TODO lo que
# pongas en ese bloque. Lo que no pongas, no filtra.
#
# Campos disponibles (todos opcionales):
#
#   nombre          = "texto"         Nombre del filtro (sale en la notificación)
#   activa          = true / false    Para apagar un filtro sin borrarlo
#   palabras        = ["...", "..."]  Basta con que coincida UNA de las frases.
#                                     Dentro de una frase deben aparecer TODAS sus
#                                     palabras: "destined etb" = destined Y etb.
#                                     Se busca en el título, la colección y el formato.
#                                     No importan mayúsculas ni tildes.
#   excluir         = ["...", "..."]  Si aparece alguna de estas palabras, se descarta.
#   colecciones     = ["...", "..."]  Parte del nombre de la colección: "151", "prismatic",
#                                     "30th", "destined rivals", "mega evolution"...
#   formatos        = ["...", "..."]  Tipos de producto (ver lista abajo).
#   idiomas         = ["es", "en"]    Idiomas: es, en, ja, fr, it, de, ko, zh, pt, nl...
#                                     Si no lo pones se usa el de [general].
#   tiendas         = ["...", "..."]  Solo estas tiendas (por defecto: cualquiera).
#   precio_max      = 60              En euros (otras monedas se convierten aprox.).
#   precio_min      = 10
#   max_sobreprecio = 20              Máximo % por encima del precio medio de Cardmarket.
#                                     (Si el producto no tiene precio de Cardmarket, pasa.)
#   preventas       = true / false    Si avisar también de preventas.
#                                     Si no lo pones se usa el de [general].
#
# Formatos válidos:
#   etb, booster-box, booster-pack, booster-bundle, collection-box, blister,
#   tin, mini-tin, mini-tin-display, stacking-tin, deck, deck-display,
#   premium-collection, ultra-premium-collection, build-battle,
#   pin-collection, trainers-toolkit, trainer-collection, otros
# ============================================================

[general]
# Idiomas por defecto para todos los filtros. Vacío [] = cualquier idioma.
idiomas = ["es", "en"]
# Avisar también de preventas (cada filtro puede cambiarlo).
preventas = true
# Tiendas que nunca quieres que te avisen.
tiendas_excluidas = []


# ---------------- TUS FILTROS (ejemplos, cámbialos a tu gusto) ----------------

[[alerta]]
nombre = "ETB a buen precio"
formatos = ["etb"]
max_sobreprecio = 15
precio_max = 90

[[alerta]]
nombre = "Prismatic Evolutions"
colecciones = ["prismatic"]
excluir = ["sobre suelto", "single"]
precio_max = 150

[[alerta]]
nombre = "151 (cajas y displays)"
colecciones = ["151"]
formatos = ["booster-box", "booster-bundle", "ultra-premium-collection", "etb"]

[[alerta]]
nombre = "Ejemplo apagado: cualquier cosa de Charizard"
activa = false
palabras = ["charizard"]
idiomas = []
