<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock TCG</title>
<meta name="description" content="Stock en español de tus colecciones de Pokémon TCG: lo nuevo primero y la tienda más barata de cada producto.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-30-192.png" type="image/png">
<link rel="apple-touch-icon" href="icono-30-192.png">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --well: #f2f3f5;
    --raised: #ffffff;
    --chip: #f2f3f5;
    --text: #16181d;
    --muted: #5d636d;
    --faint: #8a9099;
    --line: #e6e8eb;
    --accent: #0b7a5a;
    --accent-press: #08654a;
    --on-accent: #ffffff;
    --new-bg: #e2f3ec;   --new-fg: #0a6649;
    --drop-bg: #fdeceb;  --drop-fg: #b42318;
    --deal-bg: #fff3d6;  --deal-fg: #855000;
    --pre-bg: #eceef2;   --pre-fg: #3e4550;
    --warn: #c27803;
    --shadow-sheet: 0 -8px 32px rgba(16, 18, 21, .14);
    --shadow-pop: 0 6px 24px rgba(16, 18, 21, .12);
    --radius: 12px;
    --bar-h: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #101215;
      --well: #1b1e23;
      --raised: #171a1e;
      --chip: #1f2328;
      --text: #eceef1;
      --muted: #a1a8b2;
      --faint: #7d848e;
      --line: #282c32;
      --accent: #2fb487;
      --accent-press: #27a079;
      --on-accent: #06281c;
      --new-bg: #123a2c;   --new-fg: #6fdcb2;
      --drop-bg: #42191a;  --drop-fg: #ff9a92;
      --deal-bg: #3d2c0a;  --deal-fg: #ffc861;
      --pre-bg: #262a30;   --pre-fg: #c4cad3;
      --warn: #f0a92c;
      --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, .5);
      --shadow-pop: 0 6px 24px rgba(0, 0, 0, .45);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--bar-h) + 8px); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    caret-color: var(--accent);
  }
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------------- barra superior ---------------- */
  .bar {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    padding-top: env(safe-area-inset-top);
    border-bottom: 1px solid var(--line);
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .bar-top { display: flex; align-items: center; gap: 10px; height: 52px; }
  .marca { display: flex; align-items: center; gap: 9px; text-decoration: none; min-width: 0; }
  .marca img { width: auto; height: 32px; }
  .marca b { font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
  .frescura {
    margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0;
    font-size: 12.5px; color: var(--muted); white-space: nowrap;
  }
  .frescura .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .frescura.viejo .dot { background: var(--warn); }
  .frescura span { overflow: hidden; text-overflow: ellipsis; }
  .btn-icono {
    width: 40px; height: 40px; margin-right: -8px; border: 0; background: transparent; border-radius: 10px;
    display: grid; place-items: center; color: var(--text); flex: none;
  }
  .btn-icono:active { background: var(--chip); }
  .btn-icono.girando svg { animation: girar .9s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  .buscar {
    display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px;
    background: var(--chip); border-radius: 10px; color: var(--muted);
  }
  .buscar input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 15.5px; }
  .buscar input::placeholder { color: var(--faint); }
  .buscar input::-webkit-search-cancel-button { display: none; }
  .limpiar { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; margin-right: -8px; display: none; place-items: center; border-radius: 8px; }
  .limpiar.visible { display: grid; }

  .tabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; margin-top: 4px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative; flex: none; border: 0; background: transparent; padding: 12px 0 11px;
    font-size: 14.5px; font-weight: 600; color: var(--muted); white-space: nowrap;
  }
  .tab .n { font-weight: 500; color: var(--faint); margin-left: 3px; }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2.5px; border-radius: 2px; background: var(--text);
  }

  /* ---------------- secciones ---------------- */
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  @media (min-width: 900px) { main { padding-bottom: 48px; } }

  /* navegación entre vistas: barra inferior en el móvil, en la cabecera en escritorio */
  .vistas {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex;
    background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  .vista-btn {
    flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 0 7px; font-size: 11.5px; font-weight: 600; color: var(--faint);
  }
  .vista-btn svg { width: 23px; height: 23px; }
  .vista-btn[aria-current="page"] { color: var(--text); }
  .vista-btn[aria-current="page"] svg { stroke-width: 2.2; }
  @media (min-width: 900px) {
    .vistas { position: static; border: 0; padding: 0; background: none; margin-left: 20px; gap: 2px; }
    .vista-btn { flex: none; flex-direction: row; gap: 7px; padding: 8px 12px; border-radius: 10px; font-size: 14px; }
    .vista-btn svg { width: 19px; height: 19px; }
    .vista-btn[aria-current="page"] { background: var(--chip); }
  }
  .seccion { padding-top: 22px; }
  .seccion-cab { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .seccion-cab h2 { margin: 0; font-size: 19px; letter-spacing: -.015em; }
  .seccion-cab .cuenta { color: var(--muted); font-size: 14px; }
  .seccion-cab .link { margin-left: auto; border: 0; background: none; padding: 6px 0; color: var(--accent); font-weight: 600; font-size: 14px; }

  /* novedades: filas tipo comparador */
  .filas { list-style: none; margin: 0; padding: 0; display: grid; }
  @media (min-width: 900px) { .filas { grid-template-columns: 1fr 1fr; column-gap: 32px; } }
  .fila {
    display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .fila:last-child { border-bottom: 0; }
  @media (min-width: 900px) { .fila:nth-last-child(2):nth-child(odd) { border-bottom: 0; } }
  .fila .mini { width: 64px; height: 64px; border-radius: 10px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .fila .mini img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
  .fila .info { min-width: 0; }
  .fila .evento { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
  .fila .evento.nuevo { color: var(--new-fg); }
  .fila .evento.bajada { color: var(--drop-fg); }
  .fila .evento svg { width: 14px; height: 14px; stroke-width: 2.2; }
  .fila .titulo { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fila .tienda { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fila .lado { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .fila .precio { font-size: 16px; font-weight: 750; }
  .fila .antes { font-size: 12px; color: var(--faint); text-decoration: line-through; margin-right: 4px; font-weight: 500; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; padding: 0 14px; border-radius: 9px; border: 0;
    background: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 14px; text-decoration: none; white-space: nowrap;
    transition: background-color .15s;
  }
  .btn:active { background: var(--accent-press); }
  .btn svg { width: 15px; height: 15px; stroke-width: 2.2; }
  .btn.grande { height: 42px; padding: 0 18px; font-size: 15px; border-radius: 10px; }

  .sin-novedades {
    display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: var(--radius);
    background: var(--well); color: var(--muted); font-size: 14px;
  }
  .sin-novedades svg { color: var(--faint); }
  .sin-novedades b { color: var(--text); font-weight: 600; display: block; }

  /* herramientas de catálogo */
  .herramientas { display: flex; gap: 8px; align-items: center; margin: 0 -16px 14px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
  .herramientas::-webkit-scrollbar { display: none; }
  @media (min-width: 900px) { .herramientas { flex-wrap: wrap; overflow: visible; margin: 0 0 16px; padding: 0; } }
  .chip {
    flex: none; height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg); font-size: 13.5px; font-weight: 500; white-space: nowrap; color: var(--text);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .orden { position: relative; flex: none; }
  .orden select { appearance: none; -webkit-appearance: none; padding-right: 30px; }
  .orden svg { position: absolute; right: 10px; top: 10px; width: 14px; height: 14px; pointer-events: none; color: var(--muted); }
  .separador { flex: none; width: 1px; height: 22px; background: var(--line); }

  /* rejilla de productos */
  .rejilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; }
  @media (min-width: 600px) { .rejilla { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px 16px; } }
  @media (min-width: 900px) { .rejilla { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1180px) { .rejilla { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

  .producto { display: block; border: 0; padding: 0; background: none; text-align: left; width: 100%; color: inherit; }
  .foto { position: relative; aspect-ratio: 1; border-radius: var(--radius); background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .foto img { width: 100%; height: 100%; object-fit: contain; padding: 10%; transition: transform .25s ease-out; }
  @media (hover: hover) { .producto:hover .foto img { transform: scale(1.035); } }
  .placeholder { color: var(--faint); }
  .placeholder svg { width: 34px; height: 34px; stroke-width: 1.4; }
  .foto .et { position: absolute; top: 8px; left: 8px; }
  .producto .datos { padding: 9px 2px 0; }
  .producto .desde { font-size: 12px; color: var(--muted); margin-right: 3px; font-weight: 500; }
  .producto .precio { font-size: 17px; font-weight: 750; letter-spacing: -.01em; }
  .producto .nombre { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .producto .meta { font-size: 13px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .et {
    display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px;
    font-size: 12px; font-weight: 650; white-space: nowrap;
  }
  .et svg { width: 12px; height: 12px; stroke-width: 2.4; }
  .et.nuevo { background: var(--new-bg); color: var(--new-fg); }
  .et.bajada { background: var(--drop-bg); color: var(--drop-fg); }
  .et.chollo { background: var(--deal-bg); color: var(--deal-fg); }
  .et.preventa { background: var(--pre-bg); color: var(--pre-fg); }
  .et.barato { background: var(--text); color: var(--bg); }

  .vacio { text-align: center; color: var(--muted); padding: 48px 24px; grid-column: 1 / -1; font-size: 14.5px; }
  .vacio b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
  .vacio .btn { margin-top: 14px; }
  .aviso {
    display: flex; gap: 10px; align-items: center; margin-top: 14px; padding: 11px 14px; border-radius: 10px;
    background: var(--deal-bg); color: var(--deal-fg); font-size: 13.5px; font-weight: 500;
  }

  /* esqueleto de carga */
  .esq { background: var(--well); border-radius: 8px; animation: latido 1.4s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .55; } }

  /* ---------------- ficha (bottom sheet) ---------------- */
  dialog.ficha {
    margin: auto 0 0; width: 100%; max-width: 100%; max-height: min(88dvh, 88vh); padding: 0; border: 0;
    background: var(--raised); color: var(--text); border-radius: 18px 18px 0 0; box-shadow: var(--shadow-sheet);
    overflow: hidden; display: flex; flex-direction: column;
  }
  dialog.ficha:not([open]) { display: none; }
  dialog.ficha::backdrop { background: rgba(10, 12, 15, .45); }
  dialog.ficha[open] { animation: subir .24s cubic-bezier(.2, .8, .2, 1); }
  dialog.ficha[open]::backdrop { animation: aparecer .24s ease-out; }
  @keyframes subir { from { transform: translateY(40px); opacity: .4; } }
  @keyframes aparecer { from { opacity: 0; } }
  @media (min-width: 720px) {
    dialog.ficha { margin: auto; width: min(560px, calc(100% - 48px)); max-height: min(84vh, 760px); border-radius: 18px; box-shadow: var(--shadow-pop); }
    dialog.ficha[open] { animation: aparecer .18s ease-out; }
    .asa { display: none; }
  }
  .asa { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; flex: none; }
  .ficha-cab { display: grid; grid-template-columns: 88px 1fr auto; gap: 14px; align-items: start; padding: 14px 16px 16px; border-bottom: 1px solid var(--line); flex: none; }
  .ficha-foto { width: 88px; height: 88px; border-radius: 12px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .ficha-foto img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
  .ficha-cab h2 { margin: 0; font-size: 18px; line-height: 1.25; letter-spacing: -.015em; }
  .ficha-cab .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .ficha-cab .mejor { margin-top: 8px; font-size: 14px; }
  .ficha-cab .mejor b { font-size: 18px; letter-spacing: -.01em; }
  .ficha-cab .cerrar { margin: -6px -8px 0 0; }
  .ficha-cuerpo { overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px calc(16px + env(safe-area-inset-bottom)); }
  .nota { font-size: 13px; color: var(--muted); padding: 12px 0 2px; display: flex; gap: 8px; align-items: flex-start; }
  .nota svg { width: 16px; height: 16px; margin-top: 1px; }
  .ofertas-cab { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 4px; font-size: 13px; color: var(--muted); }
  .ofertas-cab b { color: var(--text); font-size: 15px; }
  .ofertas { list-style: none; margin: 0; padding: 0; }
  .oferta { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .oferta:last-child { border-bottom: 0; }
  .oferta.con-foto { grid-template-columns: 52px 1fr auto; }
  .oferta .mini { grid-row: span 2; width: 52px; height: 52px; border-radius: 9px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .oferta .mini img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
  /* Miniaturas preparadas por el monitor: ya traen su margen blanco uniforme */
  .foto img.prep, .fila .mini img.prep, .oferta .mini img.prep, .ficha-foto img.prep { padding: 0; }
  .oferta .tienda { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .oferta .tienda span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .idioma { flex: none; font-size: 10.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; letter-spacing: .02em; }
  .oferta .titulo { font-size: 13px; line-height: 1.35; color: var(--muted); grid-column: 1; align-self: start; max-height: 2.7em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .oferta.con-foto .titulo { grid-column: 2; }
  .oferta .ets { grid-column: 1; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .oferta.con-foto .ets { grid-column: 2; }
  .oferta .lado { grid-column: -2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .oferta .precio { font-size: 17px; font-weight: 750; }
  .oferta .antes { font-size: 12px; color: var(--faint); text-decoration: line-through; display: block; text-align: right; font-weight: 500; }
  .ficha-pie { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 14px 0 0; font-size: 13px; color: var(--muted); }
  .ficha-pie a { color: var(--accent); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .ficha-pie a svg { width: 14px; height: 14px; }

  /* instalar */
  .instalar { display: none; }
  .instalar.visible { display: inline-flex; }

  /* favoritos */
  .tarjeta { position: relative; }
  .corazon {
    position: absolute; top: 6px; right: 6px; z-index: 1; width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: rgba(255, 255, 255, .94); color: #16181d; display: grid; place-items: center;
    box-shadow: 0 1px 4px rgba(16, 18, 21, .16); transition: transform .15s;
  }
  .corazon:active { transform: scale(.88); }
  .corazon svg { width: 19px; height: 19px; stroke-width: 2; }
  .corazon[aria-pressed="true"], .ficha-fav[aria-pressed="true"] { color: #e5484d; }
  .corazon[aria-pressed="true"] svg, .ficha-fav[aria-pressed="true"] svg { fill: currentColor; }
  .ficha-acciones { display: flex; margin: -6px -8px 0 0; }
  .estado-sync {
    display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: var(--radius);
    background: var(--well); font-size: 14px; color: var(--muted); margin-bottom: 18px;
  }
  .estado-sync b { color: var(--text); display: block; font-weight: 600; }
  .estado-sync > div { flex: 1; }
  .estado-sync.ok { padding: 10px 14px; }
  .estado-sync.ok svg { color: var(--accent); }
  .btn.suave { background: var(--chip); color: var(--text); }
  .lista-simple { list-style: none; margin: 0; padding: 0; }
  .lista-simple li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .lista-simple li:last-child { border-bottom: 0; }
  .lista-simple .t { font-weight: 600; font-size: 14.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lista-simple .s { font-size: 13px; color: var(--muted); grid-column: 1; }
  .lista-simple .d { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-size: 13px; color: var(--muted); }
  .lista-simple .d b { display: block; color: var(--text); font-size: 15px; }
  .lista-simple .d .vivo { color: var(--new-fg); font-weight: 600; }
  .subtitulo { font-size: 16px; margin: 26px 0 6px; letter-spacing: -.01em; }

  /* gráficos */
  .bloque { padding-top: 20px; }
  .bloque h3 { margin: 0 0 4px; font-size: 15px; }
  .bloque .resumen { margin: 0 0 12px; font-size: 13.5px; color: var(--muted); }
  .bloque .resumen b { color: var(--text); }
  .bloque .resumen b.bien { color: var(--new-fg); }
  .grafico { position: relative; }
  .grafico svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grafico .rejilla-g { stroke: var(--line); stroke-width: 1; }
  .grafico .linea { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .grafico .area { fill: color-mix(in srgb, var(--accent) 9%, transparent); }
  .grafico .punto { fill: var(--accent); stroke: var(--raised); stroke-width: 2; }
  .grafico text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grafico .zona { fill: transparent; }
  .grafico .zona:hover + .marca, .grafico .zona.activa + .marca { opacity: 1; }
  .grafico .marca { opacity: 0; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; pointer-events: none; }
  .columnas { display: flex; align-items: flex-end; gap: 2px; height: 96px; }
  .columnas .col { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: default; }
  .columnas .col i { display: block; width: 100%; min-height: 2px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .columnas .col.vacia i { background: var(--line); }
  .ejes { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .ejes.dias span { flex: 1; text-align: center; }
  .barras { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .barras li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 14px; }
  .barras .nombre-b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barras .valor { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .barras .pista { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--well); overflow: hidden; }
  .barras .pista i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
  .texto-vista { font-size: 14.5px; color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
  .texto-vista b { color: var(--text); }
  @media (min-width: 900px) { .dos-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 48px; } }

  /* precio por sobre */
  .por-sobre { font-size: 12.5px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .oferta .por-sobre { text-align: right; margin-top: -4px; }
  .acciones-oferta { grid-column: 1; display: flex; gap: 14px; margin-top: 6px; }

  .toast button { border: 0; background: none; color: #6fdcb2; font-weight: 700; padding: 0; }

  .ajustes-seccion { padding-top: 18px; }
  .ajustes-seccion + .ajustes-seccion { margin-top: 18px; border-top: 1px solid var(--line); }

  /* lanzamientos */
  .calendario { list-style: none; margin: 0; padding: 0; display: grid; }
  @media (min-width: 900px) { .calendario { grid-template-columns: 1fr 1fr; column-gap: 32px; } }

  .lanz:last-child { border-bottom: 0; }

  .lanz .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lanz .es { font-size: 13px; margin-top: 4px; color: var(--muted); }
  .lanz .es b { color: var(--text); }
  .lanz .mini { width: 64px; height: 64px; border-radius: 10px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .lanz .mini img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
  .lanz .mini img.prep { padding: 0; }
  .cuenta-atras { font-size: 12.5px; font-weight: 650; color: var(--accent); }
  .cuenta-atras.ya { color: var(--new-fg); }
  .cuenta-atras.pronto { color: var(--drop-fg); }
  .grupo-cab { display: flex; align-items: baseline; gap: 8px; margin: 22px 0 2px; }
  .grupo-cab h3 { margin: 0; font-size: 15.5px; }
  .grupo-cab span { font-size: 13px; color: var(--muted); }
  @media (prefers-color-scheme: dark) { .lanz .mini { border-color: transparent; } }

  /* tooltip compartido */
  .tip {
    position: fixed; z-index: 60; transform: translate(-50%, calc(-100% - 8px)); pointer-events: none;
    background: var(--text); color: var(--bg); font-size: 12.5px; font-weight: 600; padding: 5px 9px; border-radius: 7px;
    white-space: nowrap; box-shadow: var(--shadow-pop); opacity: 0; transition: opacity .12s;
  }
  .tip.visible { opacity: 1; }

  /* aviso flotante */
  .toast {
    position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 70; transform: translate(-50%, 12px);
    background: var(--text); color: var(--bg); font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 10px;
    box-shadow: var(--shadow-pop); opacity: 0; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); pointer-events: none;
  }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }
  @media (min-width: 900px) { .toast { bottom: 24px; } }

  /* ajustes */
  .pasos { margin: 8px 0 0; padding-left: 20px; font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
  .pasos b { color: var(--text); }
  .pasos a { color: var(--accent); font-weight: 600; }
  .campo { display: grid; gap: 6px; margin-top: 16px; font-size: 13.5px; font-weight: 600; }
  .campo input {
    height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px;
    font-size: 15px; font-weight: 400; outline: 0;
  }
  .campo input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .mensaje { font-size: 13.5px; margin-top: 10px; min-height: 1.4em; }
  .mensaje.error { color: var(--drop-fg); }
  .mensaje.ok { color: var(--new-fg); }
  .fila-botones { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  /* Las fotos de producto vienen sobre blanco: en modo oscuro se muestran sobre una base clara, como en las tiendas */
  @media (prefers-color-scheme: dark) {
    .foto, .fila .mini, .oferta .mini, .ficha-foto { background: #fff; border-color: transparent; }

  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>

<script>
"use strict";
const ORDEN_TIPOS = ["booster-box", "etb", "booster-bundle", "ultra-premium-collection", "premium-collection",
  "collection-box", "mini-tin-display", "tin", "mini-tin", "stacking-tin", "blister", "booster-pack",
  "build-battle", "pin-collection", "deck", "deck-display", "trainers-toolkit", "trainer-collection", "otros"];
// En estos tipos StockTCG mete varios modelos distintos en la misma página de producto
const VARIOS_MODELOS = new Set(["collection-box", "tin", "mini-tin", "stacking-tin", "blister", "booster-pack",
  "pin-collection", "deck", "premium-collection", "otros", "build-battle", "trainer-collection"]);
const NOMBRE_TIPO = { "etb": "Elite Trainer Box", "booster-box": "Booster Box", "booster-pack": "Sobre",
  "blister": "Blíster", "tin": "Lata", "mini-tin": "Mini lata", "mini-tin-display": "Display de mini latas",
  "collection-box": "Collection Box", "booster-bundle": "Booster Bundle", "pin-collection": "Pin Collection" };
const NOMBRE_TIPO_VARIOS = { "booster-pack": "Sobres", "blister": "Blísters", "tin": "Latas", "mini-tin": "Mini latas",
  "collection-box": "Collection Boxes", "pin-collection": "Pin Collections", "deck": "Barajas", "otros": "Otros productos" };
const IDIOMAS = { es: "ES", en: "EN", ja: "JP", fr: "FR", it: "IT", de: "DE", pt: "PT", ko: "KO", zh: "ZH" };
const NUEVO_H = 24, NOVEDAD_H = 48, BAJADA_H = 72;
const NOVEDADES_VISIBLES = 4;

const enPages = location.hostname.endsWith("github.io");
const USUARIO = enPages ? location.hostname.split(".")[0] : "ybanin";
const REPO = enPages ? location.pathname.split("/")[1] : "stocktcg-alertas";
const URL_DATOS = enPages ? `https://raw.githubusercontent.com/${USUARIO}/${REPO}/main/datos/stock.json` : "../datos/stock.json";
const URL_RUNS = `https://api.github.com/repos/${USUARIO}/${REPO}/actions/workflows/monitor.yml/runs?per_page=1&status=success`;
const URL_LANZ = enPages ? `https://raw.githubusercontent.com/${USUARIO}/${REPO}/main/datos/lanzamientos.json` : "../datos/lanzamientos.json";
const URL_HIST = enPages ? `https://raw.githubusercontent.com/${USUARIO}/${REPO}/main/datos/historial.json` : "../datos/historial.json";
// Los favoritos viven en un repositorio aparte: la clave de la app solo puede escribir ahí
const FAV_REPO = "stocktcg-favoritos";
const URL_FAVS = `https://raw.githubusercontent.com/${USUARIO}/${FAV_REPO}/main/favoritos.json`;
const API_FAVS = `https://api.github.com/repos/${USUARIO}/${FAV_REPO}/contents/favoritos.json`;
const DIAS_STATS = 30;
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const icono = (id, extra = "") => `<svg class="i" ${extra}><use href="#i-${id}"/></svg>`;
const euros = (p, moneda = "EUR") => new Intl.NumberFormat("es-ES", { style: "currency", currency: moneda, minimumFractionDigits: 2 }).format(p);
const horas = (f) => f ? (Date.now() - new Date(f).getTime()) / 3.6e6 : Infinity;
function hace(f) {
  const m = Math.max(0, Math.round((Date.now() - new Date(f).getTime()) / 60000));
  if (m < 1) return "ahora";
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24);
  return d === 1 ? "ayer" : `hace ${d} días`;
}
const leer = (k) => { try { return localStorage.getItem("stk-" + k); } catch { return null; } };
const guardar = (k, v) => { try { localStorage.setItem("stk-" + k, v); } catch {} };

const estado = {
  datos: null, grupos: [], comprobado: null,
  coleccion: "__todas", tipo: "__todos", orden: leer("orden") || "novedades", texto: "",
  verTodasNovedades: false, abierto: null,
  vista: "stock", hist: null,
  favs: new Set(JSON.parse(leer("favs") || "[]")), token: leer("token") || "",
  ocultas: new Set(JSON.parse(leer("ocultas") || "[]")),
};

// ---------------- precio por sobre ----------------
// Contenido habitual cuando la tienda no lo indica en el título
const SOBRES_TIPO = { "etb": 9, "booster-bundle": 6, "booster-box": 36, "mini-tin": 2, "mini-tin-display": 20, "booster-pack": 1 };
function sobresDe(o) {
  const t = norm(o.titulo);
  const m = t.match(/(?<!\d)(\d{1,2})\s*(?:x\s*)?(?:sobres?|packs?|booster packs?)\b/);
  if (m && +m[1] > 0) return { n: +m[1], estimado: false };
  const latas = t.match(/(?<!\d)(\d{1,2})\s*mini\s*(?:latas?|tins?)/);
  if (latas && o.tipo === "mini-tin-display") return { n: +latas[1] * 2, estimado: true };
  return SOBRES_TIPO[o.tipo] ? { n: SOBRES_TIPO[o.tipo], estimado: true } : null;
}
function porSobre(o) {
  const s = sobresDe(o);
  return s && s.n > 1 ? { precio: o.precio / s.n, ...s } : null;
}
const textoPorSobre = (ps, moneda) => `${ps.estimado ? "≈ " : ""}${euros(ps.precio, moneda)}/sobre`;
const ayudaPorSobre = (ps) => `${ps.n} sobres${ps.estimado ? " (contenido habitual; la tienda no lo indica)" : " según la tienda"}`;
const fecha = (f) => { const d = new Date(f); return `${d.getDate()} ${MESES[d.getMonth()]}`; };
const fechaHora = (f) => { const d = new Date(f); return `${fecha(f)}, ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
function duracion(min) {
  if (min < 5) return "menos de 5 min";
  if (min < 60) return `${Math.round(min)} min`;
  if (min < 48 * 60) { const h = Math.floor(min / 60), m = Math.round(min % 60); return m ? `${h} h ${m} min` : `${h} h`; }
  return `${Math.round(min / 1440)} días`;
}
const minutosEntre = (a, b) => (new Date(b) - new Date(a)) / 60000;
const mediana = (xs) => { if (!xs.length) return null; const v = xs.slice().sort((a, b) => a - b), m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };

// ---------------- datos ----------------
window.sinFoto = (img) => {
  // Si falla la miniatura preparada, se prueba con la foto original de la tienda
  if (img.dataset.orig && img.src !== img.dataset.orig) { img.classList.remove("prep"); img.src = img.dataset.orig; return; }
  const s = document.createElement("span"); s.className = "placeholder"; s.innerHTML = icono("carta"); img.replaceWith(s);
};
const URL_FOTOS = enPages ? `https://raw.githubusercontent.com/${USUARIO}/${REPO}/main/datos/` : "../datos/";
// Foto de una oferta: la miniatura uniforme del monitor si existe, si no la original
const fotoDe = (o) => o ? { url: o.foto ? URL_FOTOS + o.foto : o.img, orig: o.img, prep: !!o.foto } : null;
const nombreColeccion = (setName) => (setName || "").split(" / ").pop().replace(/\s*\((sv|m)\w*\)$/, "");
const imagen = (f) => f?.url
  ? `<img src="${esc(f.url)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"${f.prep ? ` class="prep" data-orig="${esc(f.orig || "")}"` : ""} onerror="sinFoto(this)">`
  : `<span class="placeholder">${icono("carta")}</span>`;

function construirGrupos(datos) {
  const grupos = new Map();
  for (const col of datos.colecciones) {
    for (const o of col.productos) {
      if (estado.ocultas.has(o.tienda)) continue;
      const id = col.nombre + "|" + (o.stocktcg || o.url);
      if (!grupos.has(id)) grupos.set(id, { id, filtro: col.nombre, coleccion: nombreColeccion(o.coleccion), tipo: o.tipo, tipoNombre: o.tipoNombre, ofertas: [] });
      grupos.get(id).ofertas.push(o);
    }
  }
  // La colección principal de cada filtro se muestra con el nombre del filtro (en español);
  // si una oferta es de otra colección (p. ej. Pokémon Day), se muestra la suya.
  const principal = {};
  for (const col of datos.colecciones) {
    const n = {};
    col.productos.forEach((o) => { n[o.coleccion] = (n[o.coleccion] || 0) + 1; });
    principal[col.nombre] = Object.entries(n).sort((a, b) => b[1] - a[1])[0]?.[0];
  }
  return [...grupos.values()].map((g) => {
    if (g.ofertas[0].coleccion === principal[g.filtro]) g.coleccion = g.filtro;
    g.ofertas.sort((a, b) => a.precio - b.precio);
    const m = g.ofertas[0];
    g.precio = m.precio; g.moneda = m.moneda;
    g.porSobre = g.ofertas.map(porSobre).filter(Boolean).sort((a, b) => a.precio - b.precio)[0] || null;
    g.img = fotoDe(g.ofertas.find((o) => o.foto) || g.ofertas.find((o) => o.img));
    g.variosModelos = VARIOS_MODELOS.has(g.tipo) && g.ofertas.length > 1;
    g.nombre = (g.variosModelos && NOMBRE_TIPO_VARIOS[g.tipo]) || NOMBRE_TIPO[g.tipo] || g.tipoNombre;
    g.tiendas = new Set(g.ofertas.map((o) => o.tienda)).size;
    g.cardmarket = (g.ofertas.find((o) => o.cardmarket) || {}).cardmarket;
    g.nuevo = g.ofertas.some((o) => horas(o.desde) < NUEVO_H);
    g.bajada = Math.max(0, ...g.ofertas.filter((o) => o.precioAntes && horas(o.bajadaDesde) < BAJADA_H).map((o) => Math.round((1 - o.precio / o.precioAntes) * 100)));
    g.chollo = g.ofertas.some((o) => o.chollo);
    g.preventa = g.ofertas.every((o) => o.preventa);
    g.ultimo = Math.max(0, ...g.ofertas.flatMap((o) => [o.desde, o.bajadaDesde].filter(Boolean).map((f) => new Date(f).getTime())));
    g.busqueda = norm([g.nombre, g.tipoNombre, g.coleccion, g.filtro, ...g.ofertas.flatMap((o) => [o.titulo, o.tienda])].join(" "));
    return g;
  });
}

async function cargar() {
  const btn = $("#recargar");
  btn.classList.add("girando");
  try {
    const r = await fetch(URL_DATOS + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    estado.datos = await r.json();
    estado.grupos = construirGrupos(estado.datos);
    estado.errorRed = false;
    const minuto = Math.floor(Date.now() / 60000);
    const [h, l] = await Promise.all([URL_HIST, URL_LANZ].map((u) => fetch(u + "?t=" + minuto, { cache: "no-store" }).catch(() => null)));
    if (h?.ok) estado.hist = await h.json().catch(() => estado.hist);
    if (l?.ok) estado.lanz = await l.json().catch(() => estado.lanz);
  } catch {
    estado.errorRed = true;
  } finally {
    btn.classList.remove("girando");
  }
  if (estado.datos) pintar(); else pintarError();
  comprobarFrescura();
  cargarFavoritos();
}

let ultimaConsulta = 0;
async function comprobarFrescura(forzar) {
  if (!forzar && Date.now() - ultimaConsulta < 4 * 60000) return pintarFrescura();
  ultimaConsulta = Date.now();
  try {
    const r = await fetch(URL_RUNS, { headers: { Accept: "application/vnd.github+json" } });
    if (r.ok) estado.comprobado = (await r.json()).workflow_runs?.[0]?.updated_at || null;
  } catch {}
  pintarFrescura();
}
function pintarFrescura() {
  const el = $("#frescura");
  const ref = estado.comprobado || estado.datos?.actualizado;
  if (!ref) return;
  const viejo = horas(ref) > 0.5;
  el.classList.toggle("viejo", viejo || estado.errorRed);
  el.querySelector("span").textContent = estado.errorRed ? "Sin conexión" : (estado.comprobado ? `Comprobado ${hace(ref)}` : `Datos ${hace(ref)}`);
  el.title = estado.comprobado ? "Última comprobación del monitor en StockTCG" : "Último cambio en el stock";
}

// ---------------- pintar ----------------
function gruposVisibles() {
  let g = estado.grupos;
  if (estado.coleccion !== "__todas") g = g.filter((x) => x.filtro === estado.coleccion);
  if (estado.texto) {
    const q = norm(estado.texto).split(/\s+/).filter(Boolean);
    g = g.filter((x) => q.every((w) => x.busqueda.includes(w)));
  }
  return g;
}

function pintar() {
  document.querySelectorAll(".vista-btn").forEach((b) => b.toggleAttribute("aria-current", b.dataset.vista === estado.vista));
  document.querySelectorAll(".vista-btn[aria-current]").forEach((b) => b.setAttribute("aria-current", "page"));
  for (const v of ["stock", "favoritos", "lanzamientos", "reposiciones"]) $("#vista-" + v).hidden = v !== estado.vista;
  $(".buscar").hidden = estado.vista === "reposiciones";
  $("#tabs").hidden = estado.vista === "lanzamientos";
  if (!estado.datos) return;
  if (estado.vista === "lanzamientos") { pintarLanzamientos(); return pintarFrescura(); }
  if (estado.vista === "favoritos") { pintarPestanas(); pintarFavoritos(); return pintarFrescura(); }
  if (estado.vista === "reposiciones") { pintarPestanas(); pintarReposiciones(); return pintarFrescura(); }
  pintarStock();
}

function pintarPestanas() {
  const colecciones = estado.datos.colecciones.map((c) => c.nombre);
  if (estado.coleccion !== "__todas" && !colecciones.includes(estado.coleccion)) estado.coleccion = "__todas";
  const cuenta = (nombre) => {
    if (estado.vista === "reposiciones") return reposicionesRecientes(nombre).length;
    const g = estado.grupos.filter((x) => nombre === "__todas" || x.filtro === nombre);
    return estado.vista === "favoritos" ? g.filter((x) => estado.favs.has(x.id)).length : g.length;
  };
  $("#tabs").innerHTML = ["__todas", ...colecciones].map((c) =>
    `<button class="tab" role="tab" data-col="${esc(c)}" aria-selected="${c === estado.coleccion}">${c === "__todas" ? "Todo" : esc(c)}<span class="n num">${cuenta(c)}</span></button>`).join("");
}

function pintarStock() {
  const d = estado.datos;
  const colecciones = d.colecciones.map((c) => c.nombre);
  if (estado.coleccion !== "__todas" && !colecciones.includes(estado.coleccion)) estado.coleccion = "__todas";

  pintarPestanas();

  const base = gruposVisibles();
  pintarNovedades(base);

  // chips de tipo
  const tipos = [...new Map(base.map((g) => [g.tipo, NOMBRE_TIPO_VARIOS[g.tipo] || NOMBRE_TIPO[g.tipo] || g.tipoNombre])).entries()]
    .sort((a, b) => ORDEN_TIPOS.indexOf(a[0]) - ORDEN_TIPOS.indexOf(b[0]));
  if (estado.tipo !== "__todos" && !tipos.some(([t]) => t === estado.tipo)) estado.tipo = "__todos";
  $("#tipos").innerHTML = [["__todos", "Todo"], ...tipos].map(([t, n]) =>
    `<button class="chip" data-tipo="${esc(t)}" aria-pressed="${t === estado.tipo}">${esc(n)}</button>`).join("");
  $("#orden").value = estado.orden;

  let lista = estado.tipo === "__todos" ? base.slice() : base.filter((g) => g.tipo === estado.tipo);
  const porTipo = (g) => { const i = ORDEN_TIPOS.indexOf(g.tipo); return i < 0 ? 99 : i; };
  const orden = {
    barato: (a, b) => a.precio - b.precio,
    caro: (a, b) => b.precio - a.precio,
    tiendas: (a, b) => b.ofertas.length - a.ofertas.length || a.precio - b.precio,
    sobre: (a, b) => (a.porSobre ? a.porSobre.precio : Infinity) - (b.porSobre ? b.porSobre.precio : Infinity) || a.precio - b.precio,
    novedades: (a, b) => (b.nuevo - a.nuevo) || ((b.bajada > 0) - (a.bajada > 0)) || (b.ultimo - a.ultimo) || (porTipo(a) - porTipo(b)) || (a.precio - b.precio),
  }[estado.orden];
  lista.sort(orden);

  const ofertas = lista.reduce((n, g) => n + g.ofertas.length, 0);
  $("#stock-cuenta").textContent = lista.length ? `${lista.length} ${lista.length === 1 ? "producto" : "productos"} · ${ofertas} ${ofertas === 1 ? "oferta" : "ofertas"}` : "";
  $("#rejilla").innerHTML = lista.length ? lista.map(tarjeta).join("") : vacio();
  $("#aviso-red").innerHTML = estado.errorRed ? `<div class="aviso">${icono("info")}No hay conexión: estás viendo los últimos datos guardados.</div>` : "";
  pintarFrescura();
}

function eventoDe(o) {
  const n = horas(o.desde), b = o.precioAntes ? horas(o.bajadaDesde) : Infinity;
  if (n < NOVEDAD_H && n <= b) return { tipo: "nuevo", cuando: o.desde };
  if (b < BAJADA_H) return { tipo: "bajada", cuando: o.bajadaDesde };
  return null;
}

function pintarNovedades(grupos) {
  const filas = [];
  for (const g of grupos) for (const o of g.ofertas) { const e = eventoDe(o); if (e) filas.push({ g, o, e }); }
  filas.sort((a, b) => new Date(b.e.cuando) - new Date(a.e.cuando));
  $("#novedades-cuenta").textContent = filas.length ? `${filas.length} en las últimas 48 h` : "";
  const mas = $("#novedades-mas");
  mas.hidden = filas.length <= NOVEDADES_VISIBLES;
  mas.textContent = estado.verTodasNovedades ? "Ver menos" : `Ver todas (${filas.length})`;
  const visibles = estado.verTodasNovedades ? filas : filas.slice(0, NOVEDADES_VISIBLES);

  if (!filas.length) {
    $("#novedades-lista").innerHTML = `<div class="sin-novedades">${icono("campana")}<div><b>Sin novedades en las últimas 48 horas</b>Cuando entre algo te llegará un aviso al móvil y aparecerá aquí.</div></div>`;
    return;
  }
  $("#novedades-lista").innerHTML = `<ul class="filas">${visibles.map(({ g, o, e }) => {
    const pct = e.tipo === "bajada" ? Math.round((1 - o.precio / o.precioAntes) * 100) : 0;
    const texto = e.tipo === "nuevo" ? `Entró ${hace(e.cuando)}` : `−${pct} % · ${hace(e.cuando)}`;
    return `<li class="fila" data-grupo="${esc(g.id)}" data-url="${esc(o.url)}">
      <div class="mini">${imagen(o.img ? fotoDe(o) : g.img)}</div>
      <div class="info">
        <div class="evento ${e.tipo}">${icono(e.tipo === "nuevo" ? "reloj" : "baja")}${texto}</div>
        <div class="titulo">${esc(g.nombre)}</div>
        <div class="tienda">${esc(g.coleccion)} · ${esc(o.tienda)}${o.preventa ? " · preventa" : ""}</div>
      </div>
      <div class="lado">
        <span class="precio num">${euros(o.precio, o.moneda)}</span>
        <a class="btn" href="${esc(o.url)}" target="_blank" rel="noopener">Comprar</a>
      </div>
    </li>`;
  }).join("")}</ul>`;
}

function etiquetaGrupo(g) {
  if (g.nuevo) return `<span class="et nuevo">Nuevo</span>`;
  if (g.bajada) return `<span class="et bajada">−${g.bajada} %</span>`;

// ---------------- historial de precios ----------------
function seriePrecios(id) {
  const dias = estado.hist?.precios?.[id];
  return dias ? Object.entries(dias).sort((a, b) => a[0].localeCompare(b[0])).slice(-60).map(([d, v]) => ({ d, v })) : [];
}

function bloquePrecios(g) {
  const serie = seriePrecios(g.id);
  if (serie.length < 2) {
    return `<section class="bloque"><h3>Historial de precios</h3><p class="resumen">${serie.length
      ? `Empezó a registrarse el ${fecha(serie[0].d)}. En unos días verás aquí cómo ha cambiado el precio.`
      : "Todavía no hay historial de este producto."}</p></section>`;
  }
  const anteriores = serie.slice(0, -1);
  const minAnt = anteriores.reduce((m, x) => (x.v < m.v ? x : m));
  const dias = Math.round((new Date(serie.at(-1).d) - new Date(serie[0].d)) / 864e5) + 1;
  const veredicto = g.precio <= minAnt.v
    ? `<b class="bien">Es el precio más bajo</b> de los últimos ${dias} días.`
    : `Ha estado más barato: <b class="num">${euros(minAnt.v)}</b> el ${fecha(minAnt.d)}.`;
  return `<section class="bloque"><h3>Historial de precios</h3><p class="resumen">${veredicto} Precio más bajo de cada día, todas las tiendas.</p>${graficoLinea(serie)}</section>`;
}

function graficoLinea(serie) {
  const W = Math.round(Math.min(innerWidth, 560) - 32), H = 140, arriba = 10, abajo = 22, derecha = 46;
  const t0 = new Date(serie[0].d).getTime(), t1 = new Date(serie.at(-1).d).getTime();
  const vs = serie.map((x) => x.v), min = Math.min(...vs), max = Math.max(...vs), pad = (max - min) * 0.15 || max * 0.05;
  const lo = min - pad, hi = max + pad;
  const x = (d) => ((new Date(d).getTime() - t0) / (t1 - t0 || 1)) * (W - derecha);
  const y = (v) => arriba + (1 - (v - lo) / (hi - lo)) * (H - arriba - abajo);
  // Escalones: el precio mínimo del día se mantiene hasta el día siguiente
  let d = `M${x(serie[0].d)},${y(serie[0].v)}`;
  for (let i = 1; i < serie.length; i++) d += ` H${x(serie[i].d)} V${y(serie[i].v)}`;
  const area = `${d} V${H - abajo} H0 Z`;
  const ultimo = serie.at(-1);
  const zonas = serie.map((p, i) => {
    const a = i ? (x(serie[i - 1].d) + x(p.d)) / 2 : 0, b = i < serie.length - 1 ? (x(p.d) + x(serie[i + 1].d)) / 2 : W - derecha;
    return `<rect class="zona" x="${a}" y="0" width="${Math.max(b - a, 1)}" height="${H - abajo}" data-tip="${esc(`${fecha(p.d)}: ${euros(p.v)}`)}"/><line class="marca" x1="${x(p.d)}" x2="${x(p.d)}" y1="${arriba}" y2="${H - abajo}"/>`;
  }).join("");
  return `<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`Precio más bajo por día, de ${euros(min)} a ${euros(max)}`)}">
    <line class="rejilla-g" x1="0" x2="${W - derecha}" y1="${y(max)}" y2="${y(max)}"/>
    <line class="rejilla-g" x1="0" x2="${W - derecha}" y1="${y(min)}" y2="${y(min)}"/>
    <line class="rejilla-g" x1="0" x2="${W - derecha}" y1="${H - abajo}" y2="${H - abajo}"/>
    <path class="area" d="${area}"/><path class="linea" d="${d}" vector-effect="non-scaling-stroke"/>
    <circle class="punto" cx="${x(ultimo.d)}" cy="${y(ultimo.v)}" r="4" vector-effect="non-scaling-stroke"/>
    <text x="${W - derecha + 6}" y="${y(max) + 4}">${esc(euros(max).replace(/,00/, ""))}</text>
    ${max !== min ? `<text x="${W - derecha + 6}" y="${y(min) + 4}">${esc(euros(min).replace(/,00/, ""))}</text>` : ""}
    <text x="0" y="${H - 6}">${fecha(serie[0].d)}</text>
    <text x="${W - derecha}" y="${H - 6}" text-anchor="end">${fecha(ultimo.d)}</text>
    ${zonas}
  </svg></div>`;
}

// ---------------- reposiciones ----------------
function reposicionesRecientes(filtro = estado.coleccion) {
  const limite = Date.now() - DIAS_STATS * 864e5;
  return (estado.hist?.reposiciones || []).filter((r) => !estado.ocultas.has(r.tienda) &&
    new Date(r.entrada).getTime() >= limite && (filtro === "__todas" || r.filtro === filtro));
}

function nombreDeGrupo(id) {
  const g = estado.grupos.find((x) => x.id === id);
  if (g) return { nombre: g.nombre, coleccion: g.coleccion };
  const [filtro, url = ""] = id.split("|");
  const tipo = (url.split("/p/")[1] || "").split("--")[1];
  return { nombre: NOMBRE_TIPO[tipo] || (tipo ? tipo.replace(/-/g, " ") : "Producto"), coleccion: filtro };
}

function bloqueReposicionesProducto(g) {
  const lista = (estado.hist?.reposiciones || []).filter((r) => r.grupo === g.id).sort((a, b) => b.entrada.localeCompare(a.entrada));
  if (!lista.length) return "";
  const cerradas = lista.filter((r) => r.salida).map((r) => minutosEntre(r.entrada, r.salida));
  const med = mediana(cerradas);
  return `<section class="bloque"><h3>Reposiciones</h3>
    <p class="resumen">Se ha repuesto <b>${lista.length} ${lista.length === 1 ? "vez" : "veces"}</b>${med != null ? `; normalmente se agota en <b>${duracion(med)}</b>` : ""}.</p>
    <ul class="lista-simple">${lista.slice(0, 6).map((r) => filaReposicion(r)).join("")}</ul></section>`;
}

function filaReposicion(r, conProducto) {
  const dur = r.salida ? `Se agotó en ${duracion(minutosEntre(r.entrada, r.salida))}` : `<span class="vivo">Sigue en stock</span>`;
  const prod = conProducto ? nombreDeGrupo(r.grupo) : null;
  return `<li${conProducto && estado.grupos.some((x) => x.id === r.grupo) ? ` data-grupo="${esc(r.grupo)}" style="cursor:pointer"` : ""}>
    <span class="t">${prod ? `${esc(prod.nombre)} · ${esc(prod.coleccion)}` : esc(r.tienda)}</span>
    <span class="d"><b class="num">${euros(r.precio)}</b>${dur}</span>
    <span class="s">${prod ? `${esc(r.tienda)} · ` : ""}${fechaHora(r.entrada)}</span>
  </li>`;
}

function pintarReposiciones() {
  const lista = reposicionesRecientes();
  const v = $("#vista-reposiciones");
  const donde = estado.coleccion === "__todas" ? "de tus colecciones" : `de ${esc(estado.coleccion)}`;
  const inicio = (estado.hist?.reposiciones || []).reduce((m, r) => (!m || r.entrada < m ? r.entrada : m), null);
  if (!lista.length) {
    v.innerHTML = `<section class="seccion"><div class="seccion-cab"><h2>Reposiciones</h2></div>
      <div class="sin-novedades">${icono("grafico")}<div><b>Aún no hay reposiciones registradas ${donde}</b>
      El monitor las registra desde el 12 oct. Con unos días de datos verás qué tiendas reponen más, a qué horas y cuánto tardan en agotarse.</div></div></section>`;
    return;
  }
  const cerradas = lista.filter((r) => r.salida).map((r) => minutosEntre(r.entrada, r.salida));
  const med = mediana(cerradas);
  const horas24 = Array(24).fill(0), dias7 = Array(7).fill(0), tiendas = {};
  for (const r of lista) {
    const d = new Date(r.entrada);
    horas24[d.getHours()]++; dias7[(d.getDay() + 6) % 7]++;
    (tiendas[r.tienda] ||= { n: 0, dur: [] }).n++;
    if (r.salida) tiendas[r.tienda].dur.push(minutosEntre(r.entrada, r.salida));
  }
  const pico = horas24.indexOf(Math.max(...horas24));
  const diaPico = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"][dias7.indexOf(Math.max(...dias7))];
  const ranking = Object.entries(tiendas).sort((a, b) => b[1].n - a[1].n).slice(0, 8);
  const maxT = ranking[0][1].n, maxH = Math.max(...horas24), maxD = Math.max(...dias7);
  const desde = inicio && new Date(inicio).getTime() > Date.now() - DIAS_STATS * 864e5 ? `desde el ${fecha(inicio)}` : `en los últimos ${DIAS_STATS} días`;

  v.innerHTML = `<section class="seccion">
    <div class="seccion-cab"><h2>Reposiciones</h2><span class="cuenta">${desde}</span></div>
    <p class="texto-vista"><b>${lista.length} ${lista.length === 1 ? "reposición" : "reposiciones"}</b> ${donde}.
      ${med != null ? `La mitad se agotaron en menos de <b>${duracion(med)}</b>.` : "Todavía no se ha agotado ninguna."}
      La hora con más movimiento es de <b>${pico}:00 a ${pico + 1}:00</b>${lista.length >= 5 ? ` y el día, el <b>${diaPico}</b>` : ""}.</p>
    <div class="dos-col">
      <div class="bloque"><h3>Tiendas que más reponen</h3>
        <ul class="barras">${ranking.map(([t, x]) => {
          const m = mediana(x.dur);
          return `<li><span class="nombre-b">${esc(t)}</span><span class="valor">${x.n} ${x.n === 1 ? "vez" : "veces"}${m != null ? ` · se agota en ${duracion(m)}` : ""}</span>
            <span class="pista"><i style="width:${(x.n / maxT) * 100}%"></i></span></li>`;
        }).join("")}</ul>
      </div>
      <div>
        <div class="bloque"><h3>A qué hora</h3>
          <div class="columnas" role="img" aria-label="Reposiciones por hora del día">${horas24.map((n, h) =>
            `<div class="col${n ? "" : " vacia"}" data-tip="${h}:00–${h + 1}:00 · ${n} ${n === 1 ? "reposición" : "reposiciones"}"><i style="height:${n ? Math.max((n / maxH) * 100, 4) : 2}%"></i></div>`).join("")}</div>
          <div class="ejes"><span>0 h</span><span>6 h</span><span>12 h</span><span>18 h</span><span>23 h</span></div>
        </div>
        <div class="bloque"><h3>Qué día</h3>
          <div class="columnas" style="height:72px;gap:6px">${dias7.map((n, i) =>
            `<div class="col${n ? "" : " vacia"}" data-tip="${["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"][i]} · ${n}"><i style="height:${n ? Math.max((n / maxD) * 100, 6) : 3}%"></i></div>`).join("")}</div>
          <div class="ejes dias">${["L", "M", "X", "J", "V", "S", "D"].map((d) => `<span>${d}</span>`).join("")}</div>
        </div>
      </div>
    </div>
    <h3 class="subtitulo">Últimas reposiciones</h3>
    <ul class="lista-simple">${lista.slice().sort((a, b) => b.entrada.localeCompare(a.entrada)).slice(0, 25).map((r) => filaReposicion(r, true)).join("")}</ul>
  </section>`;
}

// ---------------- lanzamientos y preventas en español ----------------
const MESES_LARGOS = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const fechaLocal = (iso) => { const [a, m, d] = iso.split("-").map(Number); return new Date(a, m - 1, d); };
function diasHasta(iso) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  return Math.round((fechaLocal(iso) - hoy) / 864e5);
}
function cuentaAtras(l) {
  const d = diasHasta(l.fecha);
  if (d < 0) return { texto: "Ya a la venta", clase: "ya" };
  if (d === 0) return { texto: "Sale hoy", clase: "pronto" };
  if (d === 1) return { texto: "Sale mañana", clase: "pronto" };
  return { texto: `${l.fechaConfirmada ? "" : "Aprox. "}en ${d} días`, clase: d <= 7 ? "pronto" : "" };
}
const nombreEs = (n) => (n || "").includes(" / ") ? n.split(" / ").pop().replace(/\s*\([^)]*\)\s*$/, "") : (n || "");

function resumenEspanol(l) {
  const n = l.ofertas.length;
  if (!n) return `Todavía sin ofertas en español`;
  const pre = l.ofertas.filter((o) => o.preventa).length;
  const min = Math.min(...l.ofertas.map((o) => o.precio));
  return `<b>${n} ${n === 1 ? "oferta" : "ofertas"} en español</b>${pre ? ` · ${pre} en preventa` : ""} · desde ${euros(min)}`;
}

function filtrarTexto(lista, campos) {
  if (!estado.texto) return lista;
  const q = norm(estado.texto).split(/\s+/).filter(Boolean);
  return lista.filter((x) => { const t = norm(campos(x)); return q.every((w) => t.includes(w)); });
}

function pintarLanzamientos() {
  const v = $("#vista-lanzamientos");
  const d = estado.lanz;
  if (!d) {
    v.innerHTML = `<section class="seccion"><div class="seccion-cab"><h2>Lanzamientos</h2></div>
      <div class="sin-novedades">${icono("calendario")}<div><b>El calendario aún no está disponible</b>Se genera en la próxima comprobación del monitor.</div></div></section>`;
    return;
  }
  const lanz = filtrarTexto(d.lanzamientos,
    (l) => `${l.nombre} ${l.tipo} ${l.ofertas.map((o) => `${o.titulo} ${o.tienda}`).join(" ")}`);
  const proximos = lanz.filter((l) => diasHasta(l.fecha) >= 0), recientes = lanz.filter((l) => diasHasta(l.fecha) < 0);
  const preventas = filtrarTexto(d.preventas.filter((o) => !estado.ocultas.has(o.tienda)),
    (o) => `${o.titulo} ${o.tienda} ${o.coleccion} ${o.tipoNombre}`);
  const grupos = {};
  for (const o of preventas) (grupos[nombreEs(o.coleccion)] ||= []).push(o);
  const ordenGrupos = Object.entries(grupos).sort((a, b) => {
    const fa = Math.min(...a[1].map((o) => o.fecha ? fechaLocal(o.fecha).getTime() : Infinity));
    const fb = Math.min(...b[1].map((o) => o.fecha ? fechaLocal(o.fecha).getTime() : Infinity));
    return fa - fb || a[0].localeCompare(b[0]);
  });

  const fila = (l) => {
    const f = fechaLocal(l.fecha), c = cuentaAtras(l);
    return `<li class="lanz${diasHasta(l.fecha) < 0 ? " pasado" : ""}" data-lanz="${esc(l.slug)}">
      <time class="dia" datetime="${esc(l.fecha)}"><span>${MESES[f.getMonth()]}</span><b>${f.getDate()}</b></time>
      <div class="info">
        <div class="cuenta-atras ${c.clase}">${c.texto}</div>
        <h3>${esc(nombreEs(l.nombre))}</h3>
        <div class="s">${esc(l.tipo)}</div>
        <div class="es">${resumenEspanol({ ...l, ofertas: l.ofertas.filter((o) => !estado.ocultas.has(o.tienda)) })}</div>
      </div>
      <div class="mini">${imagen(l.img ? { url: l.foto ? URL_FOTOS + l.foto : l.img, orig: l.img, prep: !!l.foto } : null)}</div>
    </li>`;
  };
  const filaPreventa = (o) => `<li class="fila">
      <div class="mini">${imagen(fotoDe(o))}</div>
      <div class="info">
        <div class="titulo">${esc(NOMBRE_TIPO[o.tipo] || o.tipoNombre)}</div>
        <div class="tienda">${esc(o.tienda)}${o.fecha ? ` · sale el ${fechaLocal(o.fecha).getDate()} ${MESES[fechaLocal(o.fecha).getMonth()]}` : ""}</div>
      </div>
      <div class="lado">
        <span class="precio num">${euros(o.precio, o.moneda)}</span>
        <a class="btn" href="${esc(o.url)}" target="_blank" rel="noopener">Reservar</a>
      </div>
    </li>`;

  v.innerHTML = `<section class="seccion">
      <div class="seccion-cab"><h2>Próximos lanzamientos</h2><span class="cuenta num">${proximos.length}</span></div>
      ${proximos.length ? `<ul class="calendario">${proximos.map(fila).join("")}</ul>`
        : `<div class="sin-novedades">${icono("calendario")}<div><b>${estado.texto ? "Ningún lanzamiento coincide con la búsqueda" : "No hay lanzamientos anunciados"}</b>El calendario sale de StockTCG y se revisa cada 6 horas.</div></div>`}
      ${recientes.length ? `<div class="grupo-cab"><h3>Recién salidos</h3><span>últimos 14 días</span></div><ul class="calendario">${recientes.map(fila).join("")}</ul>` : ""}
    </section>
    <section class="seccion">
      <div class="seccion-cab"><h2>Preventas en español</h2><span class="cuenta num">${preventas.length}</span></div>
      <p class="texto-vista" style="margin:0 0 4px">De cualquier colección, aunque no esté en tus filtros. Te aviso al móvil cuando abre una nueva.</p>
      ${ordenGrupos.length ? ordenGrupos.map(([col, lista]) => `
        <div class="grupo-cab"><h3>${esc(col)}</h3><span>${lista.length} ${lista.length === 1 ? "preventa" : "preventas"}</span></div>
        <ul class="filas">${lista.sort((a, b) => a.precio - b.precio).map(filaPreventa).join("")}</ul>`).join("")
        : `<div class="sin-novedades">${icono("campana")}<div><b>Ahora mismo no hay preventas en español</b>En cuanto una tienda abra una, te llegará un aviso.</div></div>`}
    </section>`;
}

}

function guardarFavsLocal() {
  guardar("favs", JSON.stringify([...estado.favs]));
  guardar("ocultas", JSON.stringify([...estado.ocultas]));
  guardar("favs-t", String(Date.now()));
}

function ocultarTienda(tienda, ocultar = true) {
  ocultar ? estado.ocultas.add(tienda) : estado.ocultas.delete(tienda);
  guardarFavsLocal();
  estado.grupos = construirGrupos(estado.datos);
  if (estado.token) programarSync();
  if ($("#ficha").open) { const id = estado.abierto; estado.grupos.some((g) => g.id === id) ? abrirFicha(id, true) : cerrarFicha(); }
  if ($("#ajustes").open) abrirAjustes();
  pintar();
}

async function compartir(url, grupoId) {
  const g = estado.grupos.find((x) => x.id === grupoId);
  const o = g?.ofertas.find((x) => x.url === url) || g?.ofertas[0];
  const texto = g ? `${g.nombre} de ${g.coleccion}: ${euros(o.precio, o.moneda)} en ${o.tienda}` : "Mira esto";
  try {
    if (navigator.share) return await navigator.share({ title: g ? g.nombre : "Stock TCG", text: texto, url });
    await navigator.clipboard.writeText(`${texto} ${url}`);
    aviso("Enlace copiado");
  } catch (e) {
    if (e?.name !== "AbortError") aviso("No se ha podido compartir");
  }
}

function alternarFavorito(id) {
  const ahora = !estado.favs.has(id);
  ahora ? estado.favs.add(id) : estado.favs.delete(id);
  guardarFavsLocal();
  document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach((b) => {
    b.setAttribute("aria-pressed", ahora);
    b.setAttribute("aria-label", ahora ? "Quitar de favoritos" : "Añadir a favoritos");
  });
  aviso(ahora ? (estado.token ? "Añadido a favoritos: te avisará con prioridad" : "Añadido a favoritos") : "Quitado de favoritos");
  if (estado.vista === "favoritos") pintar();
  if (estado.token) programarSync();
}

let temporizadorSync = null;
function programarSync() { clearTimeout(temporizadorSync); temporizadorSync = setTimeout(() => sincronizarFavoritos(), 900); }

const utf8b64 = (txt) => btoa(String.fromCharCode(...new TextEncoder().encode(txt)));
async function sincronizarFavoritos(intento = 1) {
  const cab = { Authorization: `Bearer ${estado.token}`, Accept: "application/vnd.github+json" };
  try {
    const r = await fetch(API_FAVS, { headers: cab, cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const actual = await r.json();
    const cuerpo = JSON.stringify({ favoritos: [...estado.favs].sort(), tiendas_ocultas: [...estado.ocultas].sort() }, null, 2) + "\n";
    const w = await fetch(API_FAVS, {
      method: "PUT", headers: { ...cab, "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Actualizar favoritos desde la app", content: utf8b64(cuerpo), sha: actual.sha }),
    });
    if (w.status === 409 && intento < 3) return sincronizarFavoritos(intento + 1);
    if (!w.ok) throw new Error(w.status);
    return true;
  } catch (e) {
    aviso(String(e.message).match(/40[134]/) ? "No se pudo guardar en GitHub: revisa la clave en Ajustes" : "No se pudo guardar en GitHub: se reintentará");
    return false;
  }
}

async function cargarFavoritos() {
  // Sin clave, los favoritos son solo de este móvil. Con clave, manda lo que hay en GitHub
  // (salvo que acabes de cambiar algo aquí y GitHub aún no lo muestre).
  if (!estado.token) return;
  if (Date.now() - Number(leer("favs-t") || 0) < 10 * 60000) return;
  try {
    const r = await fetch(URL_FAVS + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
    if (!r.ok) return;
    const datos = await r.json();
    const remotos = new Set(datos.favoritos || []), ocultas = new Set(datos.tiendas_ocultas || []);
    const igual = (a, b) => a.size === b.size && [...a].every((x) => b.has(x));
    if (!igual(remotos, estado.favs) || !igual(ocultas, estado.ocultas)) {
      estado.favs = remotos; estado.ocultas = ocultas;
      guardar("favs", JSON.stringify([...remotos])); guardar("ocultas", JSON.stringify([...ocultas]));
      estado.grupos = construirGrupos(estado.datos);
      pintar();
    }
  } catch {}
}

// ---------------- ajustes (clave de GitHub para los favoritos) ----------------
function abrirAjustes() {
  const conectado = !!estado.token;
  $("#ajustes-contenido").innerHTML = `
    <div class="ficha-cab" style="grid-template-columns:1fr auto">
      <div><h2 id="ajustes-titulo">Ajustes</h2><div class="sub">Se guardan en este móvil${conectado ? " y en GitHub" : ""}</div></div>
      <div class="ficha-acciones"><button class="btn-icono" data-accion="cerrar-ajustes" aria-label="Cerrar">${icono("x")}</button></div>
    </div>
    <div class="ficha-cuerpo">
     <section class="ajustes-seccion">
      <h3>Tiendas ocultas</h3>
      ${estado.ocultas.size ? `<p class="resumen" style="margin:0">No aparecen en la app${conectado ? " ni te avisan" : ". Para que tampoco te avisen, activa los avisos prioritarios"}.</p>
      <ul class="lista-simple">${[...estado.ocultas].sort().map((t) => `<li><span class="t">${esc(t)}</span><span class="d"><button class="btn suave" data-mostrar="${esc(t)}">Mostrar</button></span></li>`).join("")}</ul>`
      : `<p class="resumen" style="margin:0">No has ocultado ninguna. Para ocultar una tienda, abre un producto y toca «Ocultar tienda» en su oferta.</p>`}
     </section>
     <section class="ajustes-seccion">
      <h3>Avisos prioritarios ${conectado ? `<span class="et nuevo" style="vertical-align:2px">Activados</span>` : ""}</h3>
      <p class="texto-vista" style="margin-top:6px">Para que el monitor sepa cuáles son tus favoritos, la app los guarda en tu repositorio
        <b>${FAV_REPO}</b>. Necesita una clave que <b>solo</b> puede escribir en ese repositorio, así que no puede tocar nada más.</p>
      ${conectado ? `<div class="fila-botones"><button class="btn suave grande" data-accion="desconectar">Desconectar</button></div>` : `
      <ol class="pasos">
        <li>Abre <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">crear clave en GitHub</a>.</li>
        <li><b>Token name:</b> Stock TCG favoritos. <b>Expiration:</b> la más larga.</li>
        <li><b>Repository access:</b> Only select repositories → <b>${FAV_REPO}</b>.</li>
        <li><b>Permissions → Contents:</b> Read and write.</li>
        <li>Pulsa <b>Generate token</b>, cópiala y pégala aquí.</li>
      </ol>
      <label class="campo">Clave de GitHub<input id="campo-token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
      <div class="fila-botones"><button class="btn grande" data-accion="guardar-token">Guardar y comprobar</button></div>`}
      <div class="mensaje" id="mensaje-ajustes"></div>
      <p class="resumen" style="font-size:12.5px;color:var(--faint);margin-top:16px">La clave se guarda solo en este navegador.</p>
     </section>
    </div>`;
  const d = $("#ajustes");
  if (!d.open) d.showModal();
}

async function guardarToken() {
  const token = $("#campo-token").value.trim();
  const msg = $("#mensaje-ajustes");
  if (!token) { msg.className = "mensaje error"; msg.textContent = "Pega la clave primero."; return; }
  msg.className = "mensaje"; msg.textContent = "Comprobando…";
  try {
    const r = await fetch(`https://api.github.com/repos/${USUARIO}/${FAV_REPO}`, { headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } });
    const info = r.ok ? await r.json() : null;
    if (!info?.permissions?.push) throw new Error(r.ok ? "permiso" : r.status);
    estado.token = token; guardar("token", token);
    // Al conectar se juntan los favoritos de este móvil con los que ya hubiera en GitHub
    const rem = await fetch(URL_FAVS + "?t=" + Date.now(), { cache: "no-store" }).then((x) => x.json()).catch(() => ({}));
    (rem.favoritos || []).forEach((id) => estado.favs.add(id));
    (rem.tiendas_ocultas || []).forEach((t) => estado.ocultas.add(t));
    guardarFavsLocal();
    const ok = await sincronizarFavoritos();
    msg.className = ok ? "mensaje ok" : "mensaje error";
    msg.textContent = ok ? "Conectado. Tus favoritos ya avisan con prioridad." : "La clave es válida, pero no se pudieron guardar los favoritos.";
    if (ok) setTimeout(() => { $("#ajustes").close(); pintar(); }, 1200);
  } catch (e) {
    msg.className = "mensaje error";
    msg.textContent = e.message === "permiso"
      ? `La clave no tiene permiso de escritura en ${FAV_REPO}. Revisa el paso 4.`
      : "GitHub no acepta esta clave. Comprueba que la has copiado entera.";
  }
}

// ---------------- tooltip y avisos ----------------
let tipTemporizador = null;
function mostrarTip(el) {
  const t = $("#tip"), r = el.getBoundingClientRect();
  t.textContent = el.dataset.tip;
  t.style.left = Math.min(Math.max(r.left + r.width / 2, 70), innerWidth - 70) + "px";
  t.style.top = r.top + "px";
  t.classList.add("visible");
  document.querySelectorAll(".zona.activa").forEach((z) => z.classList.remove("activa"));
  if (el.classList.contains("zona")) el.classList.add("activa");
  clearTimeout(tipTemporizador); tipTemporizador = setTimeout(ocultarTip, 2500);
}
function ocultarTip() { $("#tip").classList.remove("visible"); document.querySelectorAll(".zona.activa").forEach((z) => z.classList.remove("activa")); }
document.addEventListener("pointerover", (e) => { const el = e.target.closest?.("[data-tip]"); if (el && e.pointerType === "mouse") mostrarTip(el); });
document.addEventListener("pointerout", (e) => { if (e.target.closest?.("[data-tip]") && e.pointerType === "mouse") ocultarTip(); });
document.addEventListener("scroll", ocultarTip, { passive: true, capture: true });

let avisoTemporizador = null;
function aviso(texto, accion) {
  const t = $("#toast");
  t.textContent = texto;
  t.classList.toggle("con-accion", !!accion);
  if (accion) {
    const b = document.createElement("button");
    b.textContent = accion.texto;
    b.onclick = () => { t.classList.remove("visible"); accion.hacer(); };
    t.append(b);
  }
  t.classList.add("visible");
  clearTimeout(avisoTemporizador); avisoTemporizador = setTimeout(() => t.classList.remove("visible"), accion ? 5000 : 2600);
}

function idiomasGrupo(g) {
  const nombres = { es: "Español", en: "Inglés", ja: "Japonés", fr: "Francés", it: "Italiano", de: "Alemán", pt: "Portugués" };
  const l = [...new Set(g.ofertas.flatMap((o) => (o.idioma || "").split(",")).filter(Boolean))];
  return l.map((x) => nombres[x] || x.toUpperCase()).join(", ");
}
function cerrarFicha() {
  if (history.state?.ficha) history.back(); else $("#ficha").close();
}
window.addEventListener("popstate", () => { const d = $("#ficha"); if (d.open) d.close(); });
$("#ficha").addEventListener("close", () => { estado.abierto = null; });
$("#ficha").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) return cerrarFicha(); // toque en el fondo
  if (e.target.closest("[data-accion=cerrar]")) cerrarFicha();
});
$("#ficha").addEventListener("cancel", (e) => { e.preventDefault(); cerrarFicha(); });
$("#ajustes").addEventListener("click", (e) => { if (e.target === e.currentTarget) $("#ajustes").close(); });

$("#vistas").addEventListener("click", (e) => {
  const b = e.target.closest("[data-vista]"); if (!b) return;
  estado.vista = b.dataset.vista;
  pintar();
  window.scrollTo({ top: 0 });
});

// ---------------- eventos ----------------
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-col]"); if (!b) return;
  estado.coleccion = b.dataset.col; estado.tipo = "__todos"; estado.verTodasNovedades = false;
  history.replaceState(history.state, "", estado.coleccion === "__todas" ? location.pathname : "#" + encodeURIComponent(estado.coleccion));
  pintar();
  $(`.tab[data-col="${CSS.escape(estado.coleccion)}"]`)?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  window.scrollTo({ top: 0, behavior: "smooth" });
});
$("#tipos").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tipo]"); if (!b) return;
  estado.tipo = b.dataset.tipo; pintar();
});
$("#orden").addEventListener("change", (e) => { estado.orden = e.target.value; guardar("orden", estado.orden); pintar(); });
$("#buscar").addEventListener("input", (e) => {
  estado.texto = e.target.value.trim(); $("#limpiar").classList.toggle("visible", !!e.target.value); pintar();
});
function limpiarBusqueda() { $("#buscar").value = ""; estado.texto = ""; $("#limpiar").classList.remove("visible"); pintar(); }
$("#limpiar").addEventListener("click", () => { limpiarBusqueda(); $("#buscar").focus(); });
$("#novedades-mas").addEventListener("click", () => { estado.verTodasNovedades = !estado.verTodasNovedades; pintarNovedades(gruposVisibles()); });
$("#recargar").addEventListener("click", () => { cargar(); comprobarFrescura(true); });
document.addEventListener("click", (e) => {
  if (e.target.closest("a")) return; // los enlaces a la tienda funcionan solos
  const tip = e.target.closest("[data-tip]");
  if (tip) return mostrarTip(tip);
  const fav = e.target.closest("[data-fav]");
  if (fav) return alternarFavorito(fav.dataset.fav);
  const comp = e.target.closest("[data-compartir]");
  if (comp) return compartir(comp.dataset.compartir, comp.dataset.grupoC);
  const ocu = e.target.closest("[data-ocultar]");
  if (ocu) {
    const tienda = ocu.dataset.ocultar;
    ocultarTienda(tienda, true);
    return aviso(`${tienda} oculta`, { texto: "Deshacer", hacer: () => ocultarTienda(tienda, false) });
  }
  const mos = e.target.closest("[data-mostrar]");
  if (mos) return ocultarTienda(mos.dataset.mostrar, false);
  const accion = e.target.closest("[data-accion]")?.dataset.accion;
  if (accion === "limpiar") return limpiarBusqueda();
  if (accion === "reintentar") return cargar();
  if (accion === "ajustes") return abrirAjustes();
  if (accion === "cerrar-ajustes") return $("#ajustes").close();
  if (accion === "guardar-token") return guardarToken();
  if (accion === "desconectar") { estado.token = ""; try { localStorage.removeItem("stk-token"); } catch {} $("#ajustes").close(); aviso("Desconectado de GitHub"); return pintar(); }
  const lz = e.target.closest("[data-lanz]");
  if (lz && !e.target.closest("dialog")) return abrirLanzamiento(lz.dataset.lanz);
  const g = e.target.closest("[data-grupo]");
  if (g && !e.target.closest("dialog")) abrirFicha(g.dataset.grupo);
});

// Abrir una colección desde la notificación (#Nombre)
function leerHash() {
  if (location.hash === "#lanzamientos") estado.vista = "lanzamientos";
  else if (location.hash) estado.coleccion = decodeURIComponent(location.hash.slice(1));
}
leerHash();
window.addEventListener("hashchange", () => { leerHash(); if (estado.datos) pintar(); });

esqueleto();
cargar();
setInterval(() => { if (document.visibilityState === "visible") cargar(); }, 2 * 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") cargar(); });
setInterval(pintarFrescura, 30000);

// ---------------- instalar como app ----------------
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let promptInstalar = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); promptInstalar = e; $("#instalar").classList.add("visible"); });
$("#instalar").addEventListener("click", async () => {
  if (!promptInstalar) return;
  promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar = null; $("#instalar").classList.remove("visible");
});
</script>
